name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --no-install-project --no-build
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests
      - if: runner.os != 'Linux'
        run: uv run --frozen python tests/test_native_credentials.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - if: runner.os == 'Linux'
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.SecretService.Keyring
        run: |
          dbus-run-session -- bash -e -o pipefail -c '
            uv run --frozen python -c "import secrets; print(secrets.token_urlsafe(32), end=\"\")" |
              gnome-keyring-daemon --unlock --components=secrets
            uv run --frozen python tests/test_native_credentials.py
          '
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pip-audit --skip-editable
